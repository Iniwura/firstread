name: FIRSTREAD real Qwen proof - October 10
on:
  push:
    branches:
      - ops/qwen-live-proof-20261010
    paths:
      - '.github/workflows/qwen-live-proof-20261010.yml'
  workflow_dispatch:
jobs:
  prove-real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe provider gateway network and supported paths (no credentials)
        run: |
          set +e
          getent ahostsv4 hackathon.bitgetops.com | head -n 2
          for endpoint in models responses chat/completions; do
            curl --silent --show-error --location --max-time 10 -o /dev/null \
              -w "GET /v1/$endpoint -> HTTP %{http_code}; total %{time_total}s\\n" \
              "https://hackathon.bitgetops.com/v1/$endpoint" || true
          done
      - name: Compare unauthenticated POST request protocols safely
        run: |
          for endpoint in responses chat/completions; do
            echo "Checking POST /v1/$endpoint without any real key"
            curl --silent --show-error --location --max-time 12 -o /dev/null \
              -H 'Content-Type: application/json' \
              -H 'Authorization: Bearer invalid-diagnostic-key' \
              -d '{"model":"qwen3.8-max","messages":[{"role":"user","content":"ping"}],"max_tokens":4}' \
              -w "POST /v1/$endpoint -> HTTP %{http_code}; total %{time_total}s\\n" \
              "https://hackathon.bitgetops.com/v1/$endpoint" || true
          done
      - name: Verify actual production provider and SEC citations
        env:
          FIRSTREAD_URL: https://firstread-psi.vercel.app
        run: node scripts/verify-live-ai.mjs
