name: FIRSTREAD long-demo narration fetch
on:
  push:
    branches:
      - ops/firstread-demo-audio-fetch
    paths:
      - '.github/workflows/voiceover-fetch.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Download generated long-form narration without publishing it
        shell: bash
        run: |
          mkdir -p voice-assets
          node - <<'JS'
          const {chromium}=require('playwright');
          const {spawnSync}=require('child_process');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              await page.goto('https://www.aidocmaker.com/g0/audio?name=1991357595064c39a48972ae148e669c',{waitUntil:'domcontentloaded',timeout:35000});
              let url=null;
              for(let i=0;i<20;i++){
                url=await page.locator('audio').first().getAttribute('src').catch(()=>null);
                if(url?.startsWith('https://'))break;
                await page.waitForTimeout(1500);
              }
              if(!url)throw new Error('Generated narration not available after 30 seconds');
              const result=spawnSync('curl',['-fL','--silent','--show-error','--retry','2','--max-time','45','--connect-timeout','7','--output','voice-assets/firstread-3min-narration.mp3',url],{encoding:'utf8',timeout:48000});
              const bytes=fs.existsSync('voice-assets/firstread-3min-narration.mp3')?fs.statSync('voice-assets/firstread-3min-narration.mp3').size:0;
              console.log('download_result',result.status,'audio_bytes',bytes,'curl_error',result.stderr?.slice(0,120));
              if(result.status!==0||bytes<100000)throw new Error('Audio transfer failed');
            }finally{await browser.close()}
          })().catch(e=>{console.error('NARRATION_FETCH_FAIL',e.name,e.message.slice(0,220));process.exitCode=1});
          JS
      - name: Upload generated MP3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIRSTREAD-long-demo-narration
          path: voice-assets/
