name: FIRSTREAD live source-reconciliation proof
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-reconciliation.yml'
jobs:
  live-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SEC versus Bitget MCP live discrepancies
        env:
          FIRSTREAD_URL: https://firstread-psi.vercel.app
        run: node scripts/verify-live-crosscheck.mjs
