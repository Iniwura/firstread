name: FIRSTREAD production browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-browser.yml'
      - 'scripts/browser-smoke.mjs'
      - 'src/**'
      - 'api/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --no-save --no-package-lock playwright
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Audit live production with Chromium
        env:
          FIRSTREAD_URL: https://firstread-psi.vercel.app
          FIRSTREAD_SCREENSHOT_DIR: artifacts
        run: node scripts/browser-smoke.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firstread-production-browser
          path: artifacts/
          if-no-files-found: ignore
