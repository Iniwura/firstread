name: FIRSTREAD voiceover asset fetch
on:
  push:
    branches:
      - ops/firstread-demo-audio-fetch
    paths:
      - '.github/workflows/voiceover-fetch.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Retrieve short-lived generated voice recording
        run: |
          mkdir -p voice-assets
          curl -fL --max-time 28 --connect-timeout 6 -o voice-assets/firstread-natural-narration.mp3 'https://storage.googleapis.com/adm--audio-files--lt--private/9a08c2c6-ec75-4668-a0dc-0ab10777dac8?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=dev-vm%40stockcagr.iam.gserviceaccount.com%2F20261010%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261010T120800Z&X-Goog-Expires=43200&X-Goog-SignedHeaders=host&response-content-type=audio%2Fmpeg&X-Goog-'
          ffprobe -v error -show_entries format=duration:stream=codec_name -of json voice-assets/firstread-natural-narration.mp3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firstread-natural-narration-mp3
          path: voice-assets/
