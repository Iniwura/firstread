name: FIRSTREAD editorial visual QA
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/first-visit-guided-desk-tour']
    paths:
      - 'index.html'
      - 'landing.css'
      - 'landing.js'
      - 'desk.html'
      - 'desk-polish.css'
      - 'desk-v3.css'
      - 'desk-edition.css'
      - 'desk-tour.css'
      - 'desk-tour.js'
      - 'scripts/desk-tour-smoke.mjs'
      - 'landing.css'
      - 'scripts/desk-visual-qa.mjs'
      - 'app.js'
      - 'scripts/landing-smoke.mjs'
      - 'scripts/browser-smoke.mjs'
      - '.github/workflows/design-qa.yml'
jobs:
  visual-and-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start real-data local research app
        run: |
          node scripts/dev-server.mjs > /tmp/firstread-dev.log 2>&1 &
          for i in $(seq 1 35); do
            if curl --fail --silent http://127.0.0.1:4174/api/events > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/firstread-dev.log
          exit 1
      - name: Test editorial landing across five viewports
        env:
          FIRSTREAD_URL: http://127.0.0.1:4174
          FIRSTREAD_SCREENSHOT_DIR: artifacts/landing
        run: node scripts/landing-smoke.mjs
      - name: Audit research UI in five viewport sizes and preserve homepage structure
        env:
          FIRSTREAD_URL: http://127.0.0.1:4174
          FIRSTREAD_SCREENSHOT_DIR: artifacts/bitget-blue
        run: node scripts/desk-visual-qa.mjs
      - name: Verify first-visit tour, accessibility, persistence and mobile behavior
        env:
          FIRSTREAD_URL: http://127.0.0.1:4174
          FIRSTREAD_SCREENSHOT_DIR: artifacts/tour
        run: node scripts/desk-tour-smoke.mjs
      - name: Test real historical SEC and Bitget research journey
        env:
          FIRSTREAD_URL: http://127.0.0.1:4174
          FIRSTREAD_SCREENSHOT_DIR: artifacts/desk
        run: node scripts/browser-smoke.mjs
      - name: Print app errors if checks fail
        if: failure()
        run: tail -n 100 /tmp/firstread-dev.log || true
      - name: Save desktop/mobile screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIRSTREAD-editorial-redesign-QA
          path: artifacts/
          if-no-files-found: ignore
