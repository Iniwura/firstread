name: FIRSTREAD source recheck
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/source-recheck.yml'
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only Bitget Reality and US Equity MCP probe
        run: node scripts/probe-sources.mjs
      - name: Publish source health summary
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const d=JSON.parse(readFileSync('reports/source-feasibility.json')); console.log(JSON.stringify({at:d.fetchedAt, reality:d.directReality.allSuccessful,mcpTransport:d.fundamentalsMcp.transportReachable,mcpCatalog:d.fundamentalsMcp.equityCatalogReachable,mcpBackend:d.fundamentalsMcp.backendQuerySuccessful},null,2));"
      - name: Archive raw read-only source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firstread-bitget-source-recheck
          path: reports/source-feasibility.json
