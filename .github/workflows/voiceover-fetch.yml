name: FIRSTREAD voiceover asset fetch
on:
  push:
    branches:
      - ops/firstread-demo-audio-fetch
    paths:
      - '.github/workflows/voiceover-fetch.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Retrieve and verify generated narration via curl
        run: |
          mkdir -p voice-assets
          node - <<'JS'
          const {chromium}=require('playwright'),{spawnSync}=require('child_process'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            try {
              await page.goto('https://www.aidocmaker.com/g0/audio?name=8f6959bce03f4ab393cc84b56c1aa937',{waitUntil:'domcontentloaded',timeout:25000});
              await page.locator('audio[src]').first().waitFor({timeout:25000});
              const src=await page.locator('audio').first().getAttribute('src');
              const result=spawnSync('curl',['--fail','--location','--silent','--show-error','--max-time','35','--connect-timeout','6','--output','voice-assets/firstread-narration.mp3',src],{encoding:'utf8',timeout:38000});
              const n=fs.existsSync('voice-assets/firstread-narration.mp3')?fs.statSync('voice-assets/firstread-narration.mp3').size:0;
              console.log('download_status',result.status,'bytes',n,'stderr',result.stderr?.slice(0,180));
              if(result.status!==0||n<50000)process.exitCode=1;
            }finally{await browser.close();}
          })().catch(e=>{console.log('error_category',e.name,'message',e.message.slice(0,120));process.exitCode=1});
          JS
          file voice-assets/* || true
          ffprobe -v error -show_entries format=duration:stream=codec_name -of json voice-assets/firstread-narration.mp3 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firstread-natural-voiceover
          path: voice-assets
